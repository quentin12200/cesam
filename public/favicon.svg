<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5DEB3;stop-opacity:0.8" />
    </linearGradient>
    
    <linearGradient id="magicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#81C784;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fond circulaire vert -->
  <circle cx="32" cy="32" r="31" fill="url(#magicGrad)"/>
  
  <!-- TÊTE DE VACHE simplifiée pour favicon -->
  <g transform="translate(32, 32) scale(0.45)">
    
    <!-- Crâne allongé -->
    <ellipse cx="0" cy="-5" rx="40" ry="25" fill="url(#cowGrad)" stroke="#1B5E20" stroke-width="3"/>
    
    <!-- Museau rectangulaire large -->
    <rect x="-24" y="12" width="48" height="26" rx="8" fill="#FFCCBC" stroke="#1B5E20" stroke-width="3"/>
    
    <!-- Narines -->
    <ellipse cx="-10" cy="22" rx="5" ry="4" fill="#1B5E20"/>
    <ellipse cx="10" cy="22" rx="5" ry="4" fill="#1B5E20"/>
    
    <!-- Ligne museau -->
    <line x1="0" y1="16" x2="0" y2="30" stroke="#1B5E20" stroke-width="2"/>
    
    <!-- Oreilles -->
    <ellipse cx="-40" cy="-12" rx="12" ry="18" fill="#C8E6C9" stroke="#1B5E20" stroke-width="2.5" transform="rotate(-30 -40 -12)"/>
    <ellipse cx="40" cy="-12" rx="12" ry="18" fill="#C8E6C9" stroke="#1B5E20" stroke-width="2.5" transform="rotate(30 40 -12)"/>
    
    <!-- Cornes dorées -->
    <path d="M -36 -26 Q -42 -38 -40 -44" stroke="#FFD700" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 36 -26 Q 42 -38 40 -44" stroke="#FFD700" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#glow)"/>
    
    <!-- Yeux verts lumineux -->
    <ellipse cx="-18" cy="-6" rx="7" ry="9" fill="#4CAF50" opacity="0.8"/>
    <circle cx="-18" cy="-6" r="5.5" fill="#1B5E20"/>
    <circle cx="-16" cy="-8" r="3" fill="#FFFFFF"/>
    
    <ellipse cx="18" cy="-6" rx="7" ry="9" fill="#4CAF50" opacity="0.8"/>
    <circle cx="18" cy="-6" r="5.5" fill="#1B5E20"/>
    <circle cx="20" cy="-8" r="3" fill="#FFFFFF"/>
    
    <!-- Taches blonde -->
    <ellipse cx="-12" cy="-18" rx="10" ry="8" fill="#F5DEB3" opacity="0.7"/>
    <ellipse cx="14" cy="-20" rx="12" ry="9" fill="#F5DEB3" opacity="0.7"/>
    <ellipse cx="0" cy="-24" rx="8" ry="6" fill="#F5DEB3" opacity="0.6"/>
    
  </g>
  
  <!-- Mini étoile dorée en haut -->
  <path d="M 32 8 l 1 3 l 3 0 l -2.5 2 l 1 3 l -2.5 -2 l -2.5 2 l 1 -3 l -2.5 -2 l 3 0 z" fill="#FFD700" filter="url(#glow)" transform="scale(0.8)"/>
  
</svg>
