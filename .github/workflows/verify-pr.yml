name: Verify CESAM pull request
on:
  pull_request:
    branches: [principal]
  workflow_dispatch:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: node --test --experimental-strip-types lib/validate-breeding.test.ts lib/grouped-sale.test.ts
      - run: node --test tests/troupeau-print-filtered-table.test.mjs
      - run: node --test tests/troupeau-print-pagination.test.mjs
      - run: node --test tests/troupeau-double-sort.test.mjs
      - run: node --test tests/troupeau-print-calf-wrap.test.mjs
  isolated-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: "file:/tmp/cesam-build-diagnostic-empty.db"
      TURSO_AUTH_TOKEN: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Reproduce Next.js production compilation without production database
        run: npm run build

