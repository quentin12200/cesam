name: Verify CESAM pull request
on:
  pull_request:
    branches: [principal]
  workflow_dispatch:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: node --test --experimental-strip-types lib/validate-breeding.test.ts
      # Full production build is verified by Vercel, which has the configured database.
      # This isolated runner intentionally has no access to production data.
