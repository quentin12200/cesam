name: Verify CESAM pull request
on:
  pull_request:
    branches: [principal]
  workflow_dispatch:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      # Compile production code in isolation. No production secrets, migrations or data access.
      - name: Prepare disposable local SQLite schema (no production database)
        run: npx prisma db push --url file:./ci-build-only.db
        env:
          DATABASE_URL: 'file:./ci-build-only.db'
          TURSO_DATABASE_URL: 'file:./ci-build-only.db'
          TURSO_AUTH_TOKEN: 'ci-build-only'
      - name: Build Next.js without production credentials
        run: npm run build
        env:
          DATABASE_URL: 'file:./ci-build-only.db'
          TURSO_DATABASE_URL: 'file:./ci-build-only.db'
          TURSO_AUTH_TOKEN: 'ci-build-only'
          NEXT_TELEMETRY_DISABLED: '1'
