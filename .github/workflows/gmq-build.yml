name: Vérification compilation production GMQ
on:
  pull_request:
    paths:
      - 'app/troupeau/gmq/**'
      - '.github/workflows/gmq-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Compiler Next.js sans connexion aux données réelles
        run: npm run build
        env:
          DATABASE_URL: file:./temporary-build-only.db
          TURSO_DATABASE_URL: file:./temporary-build-only.db
          TURSO_AUTH_TOKEN: placeholder-build-only
