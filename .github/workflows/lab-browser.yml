name: Lab browser tests
on:
  pull_request:
    branches: [principal]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --prefix /tmp/cesam-playwright --no-save --package-lock=false @playwright/test@1.56.1
      - run: ln -s /tmp/cesam-playwright/node_modules/@playwright node_modules/@playwright
      - run: npx prisma generate
      - run: /tmp/cesam-playwright/node_modules/.bin/playwright install --with-deps chromium webkit
      - run: /tmp/cesam-playwright/node_modules/.bin/playwright test --config=playwright.lab.config.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-browser-report
          path: |
            playwright-report/
            test-results/
